name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcrun swift --version
      - name: Build
        run: xcrun swift build
      - name: Test
        run: xcrun swift test
