name: Bug report
description: Something in myClips doesn't work as described in the README. Feature requests are closed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: myClips is a personal project; bug reports are welcome, but there is no promise of a fix or a reply. See CONTRIBUTING.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Leave out anything from your clipboard history.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: myClips version
      description: The line at the bottom of Settings (⌘,), e.g. "myClips 0.1.0 (1, a1b2c3d)".
      placeholder: myClips 0.1.0 (1, a1b2c3d)
